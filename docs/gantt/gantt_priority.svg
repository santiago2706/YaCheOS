<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 762 480" role="img" aria-labelledby="title desc">
<title id="title">Gantt PRIORITY</title>
<desc id="desc">Línea de CPU y tramos de ejecución y espera por proceso, en minutos simulados.</desc>
<defs><pattern id="waiting" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#e2e8f0"/><line x1="0" y1="0" x2="0" y2="7" stroke="#94a3b8" stroke-width="2"/></pattern></defs>
<rect width="762" height="480" fill="#fff"/>
<text x="110" y="37" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Planificación PRIORITY</text>
<text x="110" y="62" font-family="Arial,sans-serif" font-size="12" fill="#475569">Tiempo simulado (min) · color: ejecución · trama: espera</text>
<line x1="110" y1="82" x2="110" y2="371" stroke="#e2e8f0" stroke-width="1"/>
<text x="110" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569">0</text>
<line x1="166.364" y1="82" x2="166.364" y2="371" stroke="#e2e8f0" stroke-width="1"/>
<text x="166.364" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569">2</text>
<line x1="222.727" y1="82" x2="222.727" y2="371" stroke="#e2e8f0" stroke-width="1"/>
<text x="222.727" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569">4</text>
<line x1="279.091" y1="82" x2="279.091" y2="371" stroke="#e2e8f0" stroke-width="1"/>
<text x="279.091" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569">6</text>
<line x1="335.455" y1="82" x2="335.455" y2="371" stroke="#e2e8f0" stroke-width="1"/>
<text x="335.455" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569">8</text>
<line x1="391.818" y1="82" x2="391.818" y2="371" stroke="#e2e8f0" stroke-width="1"/>
<text x="391.818" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569">10</text>
<line x1="448.182" y1="82" x2="448.182" y2="371" stroke="#e2e8f0" stroke-width="1"/>
<text x="448.182" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569">12</text>
<line x1="504.545" y1="82" x2="504.545" y2="371" stroke="#e2e8f0" stroke-width="1"/>
<text x="504.545" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569">14</text>
<line x1="560.909" y1="82" x2="560.909" y2="371" stroke="#e2e8f0" stroke-width="1"/>
<text x="560.909" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569">16</text>
<line x1="617.273" y1="82" x2="617.273" y2="371" stroke="#e2e8f0" stroke-width="1"/>
<text x="617.273" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569">18</text>
<line x1="673.636" y1="82" x2="673.636" y2="371" stroke="#e2e8f0" stroke-width="1"/>
<text x="673.636" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569">20</text>
<line x1="730" y1="82" x2="730" y2="371" stroke="#e2e8f0" stroke-width="1"/>
<text x="730" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569">22</text>
<text x="98" y="137" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a">CPU</text>
<g><title>P1: 0–5 min</title><rect data-kind="cpu" data-pid="1" data-start="0" data-end="5" x="110" y="116" width="140.909" height="34" fill="#2563eb" stroke="#fff"/></g>
<text x="180.455" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">P1</text>
<g><title>P3: 5–13 min</title><rect data-kind="cpu" data-pid="3" data-start="5" data-end="13" x="250.909" y="116" width="225.455" height="34" fill="#059669" stroke="#fff"/></g>
<text x="363.636" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">P3</text>
<g><title>P4: 13–19 min</title><rect data-kind="cpu" data-pid="4" data-start="13" data-end="19" x="476.364" y="116" width="169.091" height="34" fill="#d97706" stroke="#fff"/></g>
<text x="560.909" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">P4</text>
<g><title>P2: 19–22 min</title><rect data-kind="cpu" data-pid="2" data-start="19" data-end="22" x="645.455" y="116" width="84.5455" height="34" fill="#db2777" stroke="#fff"/></g>
<text x="687.727" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">P2</text>
<text x="98" y="201" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">P1</text>
<g><title>P1 ejecuta: 0–5 min</title><rect data-kind="run" data-pid="1" data-start="0" data-end="5" x="110" y="181" width="140.909" height="28" fill="#2563eb" stroke="#fff"/></g>
<text x="98" y="247" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#db2777">P2</text>
<g><title>P2 espera: 1–19 min</title><rect data-kind="wait" data-pid="2" data-start="1" data-end="19" x="138.182" y="227" width="507.273" height="28" fill="url(#waiting)" stroke="#94a3b8"/></g>
<g><title>P2 ejecuta: 19–22 min</title><rect data-kind="run" data-pid="2" data-start="19" data-end="22" x="645.455" y="227" width="84.5455" height="28" fill="#db2777" stroke="#fff"/></g>
<text x="98" y="293" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#059669">P3</text>
<g><title>P3 espera: 2–5 min</title><rect data-kind="wait" data-pid="3" data-start="2" data-end="5" x="166.364" y="273" width="84.5455" height="28" fill="url(#waiting)" stroke="#94a3b8"/></g>
<g><title>P3 ejecuta: 5–13 min</title><rect data-kind="run" data-pid="3" data-start="5" data-end="13" x="250.909" y="273" width="225.455" height="28" fill="#059669" stroke="#fff"/></g>
<text x="98" y="339" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#d97706">P4</text>
<g><title>P4 espera: 3–13 min</title><rect data-kind="wait" data-pid="4" data-start="3" data-end="13" x="194.545" y="319" width="281.818" height="28" fill="url(#waiting)" stroke="#94a3b8"/></g>
<g><title>P4 ejecuta: 13–19 min</title><rect data-kind="run" data-pid="4" data-start="13" data-end="19" x="476.364" y="319" width="169.091" height="28" fill="#d97706" stroke="#fff"/></g>
<line x1="110" y1="386" x2="730" y2="386" stroke="#cbd5e1"/>
<text x="110" y="437" font-family="Arial,sans-serif" font-size="12" fill="#475569">Espera media</text>
<text x="110" y="460" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0f172a">7.750 min</text>
<text x="316.667" y="437" font-family="Arial,sans-serif" font-size="12" fill="#475569">Retorno medio</text>
<text x="316.667" y="460" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0f172a">13.250 min</text>
<text x="523.333" y="437" font-family="Arial,sans-serif" font-size="12" fill="#475569">Respuesta media</text>
<text x="523.333" y="460" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0f172a">7.750 min</text>
</svg>
